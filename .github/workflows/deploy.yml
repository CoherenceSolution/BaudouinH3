# Déploiement automatique sur Firebase (Hosting + règles Firestore).
#
# Se déclenche à chaque push sur main ou sur la branche de développement,
# ou à la main depuis l'onglet Actions de GitHub.
#
# Authentification sans clé (Workload Identity Federation) : GitHub prouve son identité à Google
# et endosse le compte de service github-deploy. Aucun secret à stocker.
# Mise en place : voir README, section « Déploiement automatique ».
#
# Solution de repli : si un secret FIREBASE_SERVICE_ACCOUNT (clé JSON) existe, il est utilisé à la place.
name: Deploy
on:
  push:
    branches: [main, claude/wonderful-heisenberg-3b07bp]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: baudouinheren3
  PROJECT_NUMBER: "456086247"
  DEPLOY_SERVICE_ACCOUNT: github-deploy@baudouinheren3.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vérification et build
        env:
          VITE_USE_EMULATORS: "false"
        run: npm run build

      - name: Mode d'authentification
        id: mode
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$KEY" ]; then echo "mode=key" >> "$GITHUB_OUTPUT"; else echo "mode=wif" >> "$GITHUB_OUTPUT"; fi

      - name: Authentification Google sans clé
        if: steps.mode.outputs.mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Authentification par clé (repli)
        if: steps.mode.outputs.mode == 'key'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Déploiement Firebase
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore:rules --project "$PROJECT_ID" --non-interactive --force

      - name: Adresse du site
        run: echo "https://$PROJECT_ID.web.app"
